name: Build ClarityKey APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Verify bundled dictionaries and OCR models
        run: sha256sum -c assets.sha256
      - name: Prepare permanent signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > app/release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release key: building an installable debug APK."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests and Android Lint
        run: ./gradlew testDebugUnitTest lintDebug --build-cache --no-daemon
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          CLARITYKEY_KEYSTORE_PATH: release.keystore
          CLARITYKEY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLARITYKEY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CLARITYKEY_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --no-daemon
      - name: Build installable debug APK
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew assembleDebug --build-cache --no-daemon
      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/ClarityKey-0.5.2-beta.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/ClarityKey-0.5.2-beta-debug.apk
          fi
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload ClarityKey APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ClarityKey-0.5.2-beta
          path: dist/*
          retention-days: 30
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ClarityKey ${GITHUB_REF_NAME}" \
            --generate-notes
